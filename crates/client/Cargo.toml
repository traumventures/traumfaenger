[package]
name = "traumfaenger-client"
description = "Records AI provider exchanges (HTTP, SSE, WebSocket) and streams them to a traumfaenger database; typed query client."
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
bytes = "1"
chrono.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rmp-serde = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
traumfaenger-api.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
traumfaenger-server = { path = "../server" }
