[package]
name = "ai-ledger-server"
description = "Standalone AI call ledger: DuckDB storage with separate ingestion and query HTTP APIs."
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ai-ledger-api.workspace = true
axum = "0.8"
chrono.workspace = true
duckdb = { version = "1", features = ["bundled"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["decompression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
flate2 = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["limit", "util"] }
