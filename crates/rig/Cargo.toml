[package]
name = "traumfaenger-rig"
description = "Records every request rig makes (HTTP, SSE, WebSocket) into a traumfaenger database."
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rig-core = { version = "0.44", default-features = false, features = ["websocket"] }
traumfaenger-client.workspace = true

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
rig-reqwest = { version = "0.44", features = ["rustls"] }
rig-tungstenite = "0.44"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
traumfaenger-server = { path = "../server" }
