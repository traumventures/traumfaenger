[workspace]
resolver = "3"
members = ["crates/api", "crates/server"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
ai-ledger-api = { path = "crates/api" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
