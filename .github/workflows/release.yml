name: release

# A tag v<version> publishes one release:
#   - the server image rg.fr-par.scw.cloud/traumventures/traumfaenger/traumfaenger
#     as :<version> and :<commit sha>
#   - @traumfaenger/api and @traumfaenger/client as tarballs on the GitHub
#     release, installable from their URL without a registry or token.
# Pull requests build both in ci.yml without publishing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read # ci: the "already passed" lookup

jobs:
  # Only a commit of main whose ci passed is released (the tag may point anywhere).
  gate:
    uses: traumventures/ci/.github/workflows/gate.yml@v1
    with: { await-ci: false }

  # ci.yml runs only on demand and here: this release runs it first.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  guard:
    needs: [gate, ci]
    # A published version is never replaced, neither its image nor its
    # tarballs. The release is created last, so it marks a complete run.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Refuse a version that is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          case "$status" in
            404) ;;
            200) echo "release $GITHUB_REF_NAME exists; publish a new version instead" >&2; exit 1 ;;
            *) echo "cannot check for release $GITHUB_REF_NAME (HTTP $status)" >&2; exit 1 ;;
          esac

  image:
    needs: guard
    uses: traumventures/ci/.github/workflows/docker.yml@v1
    with:
      image: traumfaenger
      push: true
    secrets: inherit

  packages:
    needs: guard
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun scripts/pack-release.ts "$GITHUB_REF_NAME" dist
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: dist/*.tgz
          retention-days: 1

  release:
    # Only after the image is in the registry: a release always has its image.
    needs: [image, packages]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: dist
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
